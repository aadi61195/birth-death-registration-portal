<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Search Records</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,"Noto Sans Devanagari",sans-serif;
background:#f3f6fa;
color:#1f2937;
}

.header{
background:#123b63;
color:white;
padding:18px 25px;
display:flex;
justify-content:space-between;
align-items:center;
}

.header h1{
margin:0;
font-size:22px;
}

.header p{
margin:5px 0 0;
opacity:.85;
}

.lang{
background:white;
color:#123b63;
border:0;
padding:9px 14px;
border-radius:6px;
font-weight:bold;
cursor:pointer;
}

.nav{
background:white;
padding:12px 25px;
border-bottom:1px solid #ddd;
}

.nav a{
text-decoration:none;
background:#e8eef5;
color:#123b63;
padding:10px 15px;
border-radius:6px;
font-weight:bold;
margin-right:8px;
display:inline-block;
}

.container{
max-width:1200px;
margin:25px auto;
padding:0 18px;
}

.card{
background:white;
padding:22px;
border-radius:10px;
box-shadow:0 2px 8px #00000012;
}

.card h2{
margin-top:0;
color:#123b63;
}

.search-box{
display:grid;
grid-template-columns:2fr 1fr auto;
gap:10px;
margin-bottom:20px;
}

.search-box input,
.search-box select{
padding:11px;
border:1px solid #cbd5e1;
border-radius:6px;
font-size:15px;
}

.search-button{
background:#1769aa;
color:white;
border:none;
border-radius:6px;
padding:11px 18px;
font-weight:bold;
cursor:pointer;
}

table{
width:100%;
border-collapse:collapse;
}

th,
td{
padding:11px;
border-bottom:1px solid #e5e7eb;
text-align:left;
font-size:14px;
}

th{
background:#eef4f9;
}

.badge{
display:inline-block;
padding:4px 9px;
border-radius:20px;
background:#e6f4ea;
color:#137333;
font-weight:bold;
}

.no-records{
text-align:center;
padding:30px;
color:#64748b;
}

.view-button{
background:#1769aa;
color:white;
border:none;
border-radius:5px;
padding:6px 10px;
cursor:pointer;
}

.details{
margin-top:20px;
display:none;
background:#f8fafc;
border:1px solid #dbe3ec;
border-radius:8px;
padding:20px;
}

.details-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.detail{
background:white;
padding:12px;
border-radius:6px;
}

.detail strong{
display:block;
color:#64748b;
font-size:13px;
margin-bottom:5px;
}

@media(max-width:700px){

.search-box{
grid-template-columns:1fr;
}

.details-grid{
grid-template-columns:1fr;
}

.header{
flex-direction:column;
align-items:flex-start;
gap:12px;
}

}

</style>

</head>

<body>


<div class="header">

<div>

<h1 id="title">
Birth & Death Records
</h1>

<p id="subtitle">
Nagar Panchayat Anandnagar
</p>

</div>

<button
class="lang"
onclick="toggleLanguage()"
id="languageButton">

हिंदी

</button>

</div>


<div class="nav">

<a href="index.html"
id="dashboardLink">

Dashboard

</a>

<a href="birth.html"
id="birthLink">

Birth Registration

</a>

<a href="records.html"
id="recordsLink">

Search Records

</a>

</div>


<div class="container">

<div class="card">

<h2 id="pageTitle">
Search Registration Records
</h2>


<div class="search-box">

<input
type="text"
id="searchInput"
placeholder="Search by name, registration number, father or mother">

<select id="searchType">

<option value="all">
All Records
</option>

<option value="birth">
Birth Records
</option>

<option value="death">
Death Records
</option>

</select>

<button
class="search-button"
onclick="searchRecords()"
id="searchButton">

Search

</button>

</div>


<table>

<thead>

<tr>

<th id="typeHead">
Type
</th>

<th id="regHead">
Registration Number
</th>

<th id="nameHead">
Name
</th>

<th id="dateHead">
Date
</th>

<th id="genderHead">
Gender
</th>

<th id="actionHead">
Action
</th>

</tr>

</thead>

<tbody id="results">

</tbody>

</table>


<div
class="details"
id="details">

<h3 id="detailsTitle">
Record Details
</h3>

<div
class="details-grid"
id="detailsGrid">
</div>

</div>


</div>

</div>


<script>

let hindi=false;


/* LOAD RECORDS */

function getAllRecords(){

let births =
JSON.parse(
localStorage.getItem("birthRecords") || "[]"
);

let deaths =
JSON.parse(
localStorage.getItem("deathRecords") || "[]"
);

return births.concat(deaths);

}


/* SEARCH */

function searchRecords(){

let query =
document.getElementById(
"searchInput"
).value.toLowerCase().trim();

let type =
document.getElementById(
"searchType"
).value;


let records =
getAllRecords();


if(type==="birth"){

records =
records.filter(
r => r.type==="Birth"
);

}


if(type==="death"){

records =
records.filter(
r => r.type==="Death"
);

}


if(query){

records =
records.filter(r =>

Object
.values(r)
.join(" ")
.toLowerCase()
.includes(query)

);

}


displayRecords(records);

}


/* DISPLAY */

function displayRecords(records){

let container =
document.getElementById(
"results"
);


if(records.length===0){

container.innerHTML=`

<tr>

<td colspan="6"
class="no-records">

${
hindi
?
"कोई रिकॉर्ड नहीं मिला।"
:
"No records found."
}

</td>

</tr>

`;

return;

}


container.innerHTML =
records.map(
(r,index)=>`

<tr>

<td>

<span class="badge">

${
hindi
?
(r.type==="Birth"
?"जन्म"
:"मृत्यु")
:
r.type
}

</span>

</td>

<td>
${r.registrationNumber || r.regNo || ""}
</td>

<td>
${r.name || ""}
</td>

<td>
${r.dateOfBirth || r.eventDate || ""}
</td>

<td>
${r.gender || ""}
</td>

<td>

<button
class="view-button"
onclick="viewRecord(${index})">

${
hindi
?
"देखें"
:
"View"
}

</button>

</td>

</tr>

`
).join("");

window.currentRecords=records;

}


/* VIEW */

function viewRecord(index){

let r =
window.currentRecords[index];


let details =
document.getElementById(
"details"
);

let grid =
document.getElementById(
"detailsGrid"
);


let fields=[];


if(r.type==="Birth"){

fields=[

["Registration Number / पंजीकरण संख्या",
r.registrationNumber],

["Date of Birth / जन्म की तारीख",
r.dateOfBirth],

["Date of Registration / पंजीकरण की तारीख",
r.dateOfRegistration],

["Gender / लिंग",
r.gender],

["Name / नाम",
r.name],

["Father's Name / पिता का नाम",
r.fatherName],

["Mother's Name / माता का नाम",
r.motherName],

["Place of Birth / जन्म स्थान",
r.placeOfBirth],

["Permanent Address / स्थायी पता",
r.permanentAddress],

["Informant / सूचक",
r.informantName],

["Informant Address / सूचक का पता",
r.informantAddress]

];

}

else{

fields=[

["Registration Number / पंजीकरण संख्या",
r.registrationNumber],

["Date / तारीख",
r.dateOfDeath],

["Date of Registration / पंजीकरण की तारीख",
r.dateOfRegistration],

["Gender / लिंग",
r.gender],

["Name / नाम",
r.name],

["Father's Name / पिता का नाम",
r.fatherName],

["Mother's Name / माता का नाम",
r.motherName],

["Place of Death / मृत्यु स्थान",
r.placeOfDeath],

["Permanent Address / स्थायी पता",
r.permanentAddress],

["Informant / सूचक",
r.informantName],

["Informant Address / सूचक का पता",
r.informantAddress]

];

}


grid.innerHTML =
fields.map(
f=>`

<div class="detail">

<strong>
${f[0]}
</strong>

${f[1] || "-"}

</div>

`
).join("");


details.style.display="block";

details.scrollIntoView({
behavior:"smooth"
});

}


/* LANGUAGE */

function toggleLanguage(){

hindi=!hindi;


if(hindi){

document.getElementById("title").innerText=
"जन्म एवं मृत्यु अभिलेख";

document.getElementById("subtitle").innerText=
"नगर पंचायत आनंदनगर";

document.getElementById("languageButton").innerText=
"English";

document.getElementById("dashboardLink").innerText=
"डैशबोर्ड";

document.getElementById("birthLink").innerText=
"जन्म पंजीकरण";

document.getElementById("recordsLink").innerText=
"रिकॉर्ड खोजें";

document.getElementById("pageTitle").innerText=
"पंजीकरण रिकॉर्ड खोजें";

document.getElementById("searchButton").innerText=
"खोजें";

document.getElementById("typeHead").innerText=
"प्रकार";

document.getElementById("regHead").innerText=
"पंजीकरण संख्या";

document.getElementById("nameHead").innerText=
"नाम";

document.getElementById("dateHead").innerText=
"तारीख";

document.getElementById("genderHead").innerText=
"लिंग";

document.getElementById("actionHead").innerText=
"कार्यवाही";

}

else{

location.reload();

}


searchRecords();

}


/* INITIAL */

searchRecords();

</script>

</body>

</html>
